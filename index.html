<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TekNova OS</title>
    <style>
      /* Estilos generales */
      body {
        margin: 0;
        font-family: sans-serif;
        background-color: #1e1e2f;
        color: white;
        overflow: hidden;
      }

      .desktop {
        width: 100vw;
        height: 100vh;
        position: relative;
        background: url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e")
          no-repeat center center/cover;
      }

      .taskbar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50px;
        background: #bdc3c7;
        display: flex;
        align-items: center;
        padding: 0 10px;
      }

      .taskbar .apps {
        display: flex;
        gap: 20px;
        margin-left: 30px;
      }

      .icon {
        width: 60px;
        text-align: center;
        margin: 10px;
        cursor: pointer;
        position: absolute;
      }

      .icon img {
        width: 60px;
        height: 60px;
      }

      .window {
        width: 320px;
        min-height: 200px;
        background: #2d2d40;
        border: 1px solid #555;
        position: absolute;
        top: 100px;
        left: 100px;
        z-index: 10;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        resize: both;
        overflow: hidden;
      }

      .window-header {
        background: #444;
        padding: 5px;
        cursor: move;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .window-body {
        padding: 10px;
      }

      input[type="text"],
      input[type="email"],
      select {
        width: 100%;
        background: #111;
        border: 1px solid #555;
        color: #0f0;
        padding: 5px;
        margin-top: 5px;
        font-family: monospace;
      }

      label {
        display: block;
        margin-top: 10px;
      }

      button {
        margin-top: 10px;
        padding: 5px 10px;
        background: #444;
        border: none;
        color: white;
        cursor: pointer;
        width: 50px;
      }

      .close-btn {
        background: red;
        border: none;
        color: white;
        padding: 2px 6px;
        cursor: pointer;
      }

      #clock {
        font-size: 24px;
        text-align: center;
      }

      #weather {
        font-size: 16px;
        text-align: center;
      }

      .calculator-button {
        width: 50px;
        height: 50px;
        background-color: #444;
        color: white;
        font-size: 20px;
        border: none;
        margin: 5px;
        cursor: pointer;
      }

      .calculator-button:hover {
        background-color: #555;
      }

      .calculator-screen {
        width: 100%;
        height: 50px;
        background-color: #111;
        color: rgb(255, 255, 255);
        text-align: right;
        padding: 10px;
        font-size: 24px;
        border: 1px solid #555;
        font-family: monospace;
      }

      /* Estilo para el navegador */
      .browser-url {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        background-color: #111;
        border: 1px solid #555;
        color: white;
        font-size: 18px;
      }

      .browser-window {
        width: 100%;
        height: 400px;
        background-color: #1e1e2f;
        color: white;
        border: 1px solid #555;
        overflow: auto;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="desktop" id="desktop">
      <!-- Iconos de apps -->
      <div
        class="icon"
        style="top: 20px; left: 20px"
        onclick="launchApp('console')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png" />
        <div>Consola</div>
      </div>

      <div
        class="icon"
        style="top: 100px; left: 20px"
        onclick="launchApp('settings')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png" />
        <div>Ajustes</div>
      </div>

      <div
        class="icon"
        style="top: 180px; left: 20px"
        onclick="launchApp('calculator')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/992/992651.png" />
        <div>Calculadora</div>
      </div>

      <div
        class="icon"
        style="top: 260px; left: 20px"
        onclick="launchApp('clock')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" />
        <div>Reloj</div>
      </div>

      <div
        class="icon"
        style="top: 340px; left: 20px"
        onclick="launchApp('weather')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/1116/1116453.png" />
        <div>Clima</div>
      </div>

      <div
        class="icon"
        style="top: 420px; left: 20px"
        onclick="launchApp('browser')"
      >
        <img src="https://cdn-icons-png.flaticon.com/512/5988/5988576.png" />
        <div>Navegador</div>
      </div>
    </div>

    <div class="taskbar">
      <span>🔷 TekNova OS</span>
      <div class="apps">
        <img
          src="https://cdn-icons-png.flaticon.com/512/1828/1828817.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('console')"
        />
        <img
          src="https://cdn-icons-png.flaticon.com/512/2099/2099058.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('settings')"
        />
        <img
          src="https://cdn-icons-png.flaticon.com/512/992/992651.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('calculator')"
        />
        <img
          src="https://cdn-icons-png.flaticon.com/512/992/992700.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('clock')"
        />
        <img
          src="https://cdn-icons-png.flaticon.com/512/1116/1116453.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('weather')"
        />
        <img
          src="https://cdn-icons-png.flaticon.com/512/5988/5988576.png"
          width="40"
          style="filter: brightness(1) invert(0)"
          onclick="launchApp('browser')"
        />
      </div>
    </div>

    <script>
      let zIndexCounter = 10;

      function makeDraggable(el) {
        const header = el.querySelector(".window-header");
        let offsetX = 0,
          offsetY = 0,
          isDown = false;

        header.addEventListener("mousedown", (e) => {
          isDown = true;
          offsetX = e.clientX - el.offsetLeft;
          offsetY = e.clientY - el.offsetTop;
          el.style.zIndex = ++zIndexCounter;
        });

        document.addEventListener("mouseup", () => (isDown = false));
        document.addEventListener("mousemove", (e) => {
          if (isDown) {
            el.style.left = e.clientX - offsetX + "px";
            el.style.top = e.clientY - offsetY + "px";
          }
        });
      }

      function createWindow(title, bodyHtml) {
        const win = document.createElement("div");
        win.className = "window";
        win.style.zIndex = ++zIndexCounter;
        win.innerHTML = `
        <div class="window-header">
          ${title}
          <button class="close-btn" onclick="this.closest('.window').remove()">X</button>
          <button class="resize-btn" onclick="resizeWindow(this)">🔲</button>
          <button class="resize-btn" onclick="resizeWindow(this)">🔳</button>
        </div>
        <div class="window-body">${bodyHtml}</div>
      `;
        document.getElementById("desktop").appendChild(win);
        makeDraggable(win);
      }

      function resizeWindow(button) {
        const window = button.closest(".window");
        const isExpanded =
          window.style.width === "640px" && window.style.height === "400px";
        if (isExpanded) {
          window.style.width = "320px";
          window.style.height = "200px";
          button.textContent = "🔳"; // Restablecer a la opción de agrandar
        } else {
          window.style.width = "640px";
          window.style.height = "400px";
          button.textContent = "🔲"; // Cambiar al icono de reducir
        }
      }

      function launchApp(app) {
        switch (app) {
          case "console":
            createWindow(
              "Consola",
              `<input type="text" placeholder="Escribe un comando..." onkeydown="if(event.key==='Enter'){handleCommand(this.value); this.value='';}">`
            );
            break;
          case "settings":
            createWindow(
              "Ajustes",
              `
            <label>🎨 Cambiar color de fondo:</label>
            <select onchange="document.querySelector('.desktop').style.backgroundColor = this.value;">
              <option value="#2e2e48">Azul oscuro</option>
              <option value="#2c3e50">Gris azulado</option>
              <option value="#1abc9c">Verde agua</option>
              <option value="#111">Negro</option>
            </select>
            <label>🌙 Modo Pantalla Negra:</label>
            <button onclick="document.body.style.backgroundColor = '#000'; document.querySelector('.desktop').style.backgroundColor = '#000';">Activar</button>
            <label>📧 Guardar tu correo electrónico:</label>
            <input type="email" id="emailInput" placeholder="ejemplo@correo.com" />
            <button onclick="saveEmail()">Guardar</button>
          `
            );
            break;
          case "calculator":
            createWindow(
              "Calculadora",
              `
            <div class="calculator-screen" id="calcScreen">0</div>
            <div>
              <button class="calculator-button" onclick="appendNumber(1)">1</button>
              <button class="calculator-button" onclick="appendNumber(2)">2</button>
              <button class="calculator-button" onclick="appendNumber(3)">3</button>
              <button class="calculator-button" onclick="appendNumber(4)">4</button>
              <button class="calculator-button" onclick="appendNumber(5)">5</button>
              <button class="calculator-button" onclick="appendNumber(6)">6</button>
              <button class="calculator-button" onclick="appendNumber(7)">7</button>
              <button class="calculator-button" onclick="appendNumber(8)">8</button>
              <button class="calculator-button" onclick="appendNumber(9)">9</button>
              <button class="calculator-button" onclick="appendNumber(0)">0</button>
              <button class="calculator-button" onclick="appendOperator('+')">+</button>
              <button class="calculator-button" onclick="appendOperator('-')">-</button>
              <button class="calculator-button" onclick="appendOperator('*')">*</button>
              <button class="calculator-button" onclick="calculate()">=</button>
              <button class="calculator-button" onclick="clearScreen()">C</button>
            </div>
          `
            );
            break;
          case "clock":
            createWindow(
              "Reloj",
              `<div id="clock">${new Date().toLocaleTimeString()}</div>`
            );
            setInterval(function () {
              document.getElementById("clock").innerText =
                new Date().toLocaleTimeString();
            }, 1000);
            break;
          case "weather":
            const apiKey = "2d1e1d530c03263b4ce458395f4c7583"; // Sustituir por tu clave API de OpenWeatherMap
            if (navigator.geolocation) {
              navigator.geolocation.getCurrentPosition(function (position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=es`;

                fetch(url)
                  .then((response) => response.json())
                  .then((data) => {
                    createWindow(
                      "Clima",
                      `
                    <div id="weather">
                      <h3>${data.name}</h3>
                      <p>${data.weather[0].description}</p>
                      <p>Temperatura: ${data.main.temp}°C</p>
                    </div>
                  `
                    );
                  })
                  .catch((error) => alert("No se pudo obtener el clima"));
              });
            }
            break;
          case "browser":
            createWindow(
              "Navegador",
              `
            <input type="text" class="browser-url" placeholder="Escribe una URL y presiona Enter..." onkeydown="if(event.key === 'Enter'){loadUrl(this.value);}">
            <div class="browser-window" id="browserContent"></div>
          `
            );
            break;
        }
      }

      function loadUrl(url) {
        const iframe = document.createElement("iframe");
        iframe.src = url;
        iframe.style.width = "100%";
        iframe.style.height = "100%";
        document.getElementById("browserContent").appendChild(iframe);
      }

      function appendNumber(number) {
        const screen = document.getElementById("calcScreen");
        if (screen.innerText === "0") {
          screen.innerText = number;
        } else {
          screen.innerText += number;
        }
      }

      function appendOperator(operator) {
        const screen = document.getElementById("calcScreen");
        screen.innerText += operator;
      }

      function clearScreen() {
        document.getElementById("calcScreen").innerText = "0";
      }

      function calculate() {
        const screen = document.getElementById("calcScreen");
        try {
          screen.innerText = eval(screen.innerText);
        } catch (e) {
          screen.innerText = "Error";
        }
      }

      function handleCommand(command) {
        alert(`Ejecutando comando: ${command}`);
      }
    </script>
  </body>
</html>
